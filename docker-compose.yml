services:
  neo4j:
    image: neo4j:5-community
    container_name: movie-rec-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-12345678}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  app:
    image: "${IMAGE_NAME:-movie-recommendation-system-app}:latest"
    build: .
    container_name: movie-rec-app
    restart: unless-stopped
    depends_on:
      - neo4j
    ports:
      - "4000:4000"
    environment:
      PORT: "${PORT:-4000}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-12345678}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"

volumes:
  neo4j_data:
  neo4j_logs:
